<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jeton" content="__JETON__">
<title>Kaoly Clients</title>
<style>
  /* Direction « clavier » : une demande à la fois, en grand, la preuve en vedette, la barre au centre du travail.
     Papier clair (#fbfaf7, comme la fenêtre Swift), encre presque noire, un seul gris, l'indigo pour la sélection et le focus.
     Trois tailles (12, 13, 20), deux graisses (400, 500). Un cadre seulement pour la preuve, la barre et un champ au focus. */
  :root {
    --fond: #fbfaf7; --encre: #171717; --gris: #666; --filet: rgba(0,0,0,.08); --survol: rgba(0,0,0,.04);
    --indigo: #615fff; --indigo-texte: #4f4ce8; --choisi: rgba(97,95,255,.08);
    --rouge: #c62828; --vert: #0f7a4a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--encre); }
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; }
  ::selection { background: rgba(97,95,255,.2); }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 4px; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  .num { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .gris { color: var(--gris); }
  .vert { color: var(--vert); }
  .point { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--rouge); flex: none; }
  .lien { color: var(--gris); font-size: 12px; }
  .lien:hover { color: var(--encre); text-decoration: underline; text-underline-offset: 3px; }
  svg { display: block; }

  /* ── la colonne ── */
  #col { width: 260px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--filet); min-width: 0; }
  #liste { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 8px 8px; scroll-padding: 12px 0; }
  .groupe { display: flex; align-items: baseline; gap: 8px; padding: 12px 10px 4px; font-size: 12px; color: var(--gris); }
  .groupe:first-child { padding-top: 4px; }
  .groupe .num { margin-left: auto; }
  .groupe.toi { font-size: 13px; font-weight: 500; color: var(--encre); }
  .groupe.toi .num { color: var(--encre); }
  .groupe .plus { color: var(--gris); opacity: 0; padding: 2px; border-radius: 4px; }
  .groupe:hover .plus, .groupe .plus:focus-visible { opacity: 1; }
  .groupe .plus:hover { color: var(--encre); background: var(--survol); }
  .filet { height: 1px; background: var(--filet); margin: 12px 10px 4px; }
  .ligne { display: block; padding: 5px 10px; border-radius: 7px; }
  .ligne:hover, .client:hover, #releve:hover { background: var(--survol); }
  .ligne.on, .client.on, #releve.on { background: var(--choisi); }
  .l1 { display: flex; align-items: baseline; gap: 10px; line-height: 18px; }
  .l1 .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .moi .t { font-weight: 500; }
  .loin .t { color: var(--gris); }
  .partante { width: 100%; animation: vient .15s ease-out; }
  .partante .annul { color: var(--encre); }
  .partante:hover .annul { text-decoration: underline; text-underline-offset: 3px; }
  .l1 .num { color: var(--gris); }
  .l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 17px; color: var(--gris); white-space: nowrap; overflow: hidden; }
  .l2 .v { flex: 1; min-width: 0; display: flex; white-space: pre; }
  .l2 .v > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .l2 .num { margin-left: auto; }
  .client { display: flex; align-items: baseline; gap: 10px; padding: 4px 10px; border-radius: 7px; }
  .client span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #releve { display: flex; align-items: center; gap: 8px; margin: 4px 8px 10px; padding: 6px 10px; border-radius: 7px; font-size: 12px; color: var(--gris); }
  #releve i { width: 6px; height: 6px; border-radius: 50%; background: var(--gris); flex: none; }
  #releve i.rouge { background: var(--rouge); }
  #releve i.non { background: none; box-shadow: inset 0 0 0 1px var(--gris); }
  #releve span { flex: 1; }
  #releve button { font-size: 12px; color: var(--encre); }
  #releve button:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ── le volet ── */
  #volet { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  #vue { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 28px 0; }
  .tete { flex: none; margin-bottom: 20px; }
  .tete .h { display: flex; align-items: baseline; gap: 16px; }
  h1 { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: balance; }
  .tete .classer { opacity: 0; }
  .tete:hover .classer, .tete .classer:focus-visible { opacity: 1; }
  .etat { margin-top: 3px; color: var(--gris); overflow-wrap: anywhere; }
  .etat a:hover { color: var(--encre); text-decoration: underline; text-underline-offset: 3px; }
  .corps { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 332px; grid-template-rows: minmax(0, 1fr); gap: 36px; align-items: start; }

  /* la preuve : un seul cadre, Avant et Après au même endroit, à la même taille */
  .preuve { display: flex; flex-direction: column; gap: 10px; min-height: 0; max-height: 100%; }
  .choix { display: flex; gap: 16px; font-size: 12px; }
  .choix button { color: var(--gris); padding: 1px 0; }
  .choix button:hover { color: var(--encre); }
  .choix button.on { color: var(--encre); text-decoration: underline; text-decoration-color: var(--indigo); text-decoration-thickness: 1.5px; text-underline-offset: 6px; }
  .cadre { margin: 0; width: 100%; aspect-ratio: 16 / 10; min-height: 0; border: 1px solid rgba(0,0,0,.1); border-radius: 8px; overflow: hidden; background: #fff; cursor: zoom-in; }
  .cadre img, .cadre video { display: block; width: 100%; height: 100%; object-fit: contain; }
  .preuve.fen { align-self: stretch; }
  .cadre.vide { display: grid; place-items: center; aspect-ratio: auto; height: 56px; background: none; border: 1px dashed rgba(0,0,0,.28); color: var(--gris); cursor: default; }

  /* le fil : trois voix nommées par qui parle */
  .fil { display: flex; flex-direction: column; min-height: 0; max-height: 100%; }
  .fil-texte { min-height: 0; overflow-y: auto; padding: 0 4px 2px 0; }
  .voix + .voix { margin-top: 18px; }
  .qui { font-size: 12px; color: var(--gris); margin-bottom: 2px; }
  .dit { max-width: 68ch; overflow-wrap: anywhere; }
  .replie { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; } /* une liste du client garde ses retours à la ligne */
  .deplie { white-space: pre-wrap; }
  .replie.court { -webkit-line-clamp: 2; } /* un message attend : la demande du client tient sur 2 lignes, un clic la déplie */
  [data-act="deplier"] { cursor: pointer; }
  .reserve { margin-top: 4px; max-width: 68ch; }
  .reserve span:first-child { text-decoration: underline dashed rgba(0,0,0,.5); text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .lead { font-size: 20px; line-height: 1.4; letter-spacing: -.01em; max-width: 34em; overflow-wrap: anywhere; }
  .lead .point { width: 8px; height: 8px; margin: 0 10px 3px 0; vertical-align: middle; }
  .nom { color: var(--gris); border-radius: 4px; }
  .nom:hover { color: var(--encre); background: var(--survol); }
  .qui-ed { display: flex; align-items: center; gap: 4px; }
  .crayon { margin-left: 2px; color: var(--gris); padding: 3px; border-radius: 4px; }
  .crayon:hover { color: var(--encre); background: var(--survol); }
  .incertain {text-decoration: underline dashed; text-underline-offset: 3px; }
  .ed { display: block; width: calc(100% + 14px); margin: 0 -7px; padding: 2px 6px; border: 1px solid transparent; border-radius: 6px; background: none; outline: 0; resize: none; line-height: 1.5; overflow-wrap: anywhere; }
  .ed:hover { background: var(--survol); }
  .ed:focus { background: #fff; border-color: var(--indigo); }
  .ed::placeholder { color: var(--gris); }
  textarea.ed { overflow: hidden; }
  .voix .ed { max-width: calc(68ch + 14px); }
  .joint { display: inline-flex; align-items: center; gap: 6px; color: var(--gris); }
  .piece { color: inherit; padding: 0 3px; border-radius: 4px; }
  button.piece:hover { color: var(--encre); background: var(--survol); }
  .piece.off { display: none; text-decoration: line-through; }
  .qui-ed:hover .piece.off { display: inline; }
  .objet { font-weight: 400; color: var(--gris); }
  .voix:not(:focus-within) .objet { display: none; } /* il redit le titre ; il part quand même avec le mail */
  .envoye { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; color: var(--gris); } /* parti : en gris, comme le passé ; le brouillon reste en encre */
  .refus { flex: none; margin: 10px 0 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .actions { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 16px 0 0; }
  .fil > details { flex: none; margin-top: 6px; }
  details:not([open]) > .detail { display: none; } /* fermé : rien à lire, rien à compter */
  .fil > details .detail { max-height: 160px; overflow-y: auto; padding-right: 4px; }
  .plein { display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 8px; background: var(--encre); color: #fff; font-weight: 500; white-space: nowrap; }
  .plein:hover { background: #2b2b2b; }
  .plein[disabled] { opacity: .4; cursor: default; }
  .plein kbd { font: 12px var(--mono); opacity: .6; }
  details { margin-top: 20px; }
  summary { display: inline-block; list-style: none; cursor: pointer; font-size: 12px; color: var(--gris); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--encre); }
  .detail { display: grid; gap: 10px; justify-items: start; margin-top: 8px; font-size: 12px; color: var(--gris); max-width: 68ch; }
  .detail .resume { white-space: pre-wrap; color: var(--encre); }
  .vide-etat { flex: 1; display: grid; place-items: center; font-size: 20px; color: var(--gris); padding-bottom: 40px; }

  /* la fiche client et les arrivées : des lignes à filets, pas de cadre */
  .chiffres { margin-top: 3px; color: var(--gris); }
  .chiffres .num { color: var(--encre); }
  .fiche { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 240px; grid-template-rows: minmax(0, 1fr); gap: 56px; align-items: start; }
  .registre { max-height: 100%; overflow-y: auto; }
  .reg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--filet); }
  .reg:hover { background: var(--survol); margin: 0 -8px; padding: 8px 8px; }
  .reg.part, .reg.part:hover { margin-top: 12px; }
  .reg .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reg .v { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--gris); white-space: nowrap; }
  .reg .v .num { min-width: 52px; text-align: right; }
  .reg.passe { color: var(--gris); }
  .reglages .bloc { padding: 0 0 16px; }
  .reglages details { margin-top: 0; }
  .reglages .detail { gap: 12px; width: 100%; max-height: none; }
  .reglages .detail .bloc { padding: 0; }
  .reglages [data-cfg=repo]:placeholder-shown:not(:focus) { border: 1px dashed rgba(0,0,0,.28); } /* pas de dépôt : le champ est en tirets, comme « Pas de capture » */
  .reglages .plus { color: var(--gris); padding: 3px; margin-left: -3px; border-radius: 4px; }
  .reglages .plus:hover { color: var(--encre); background: var(--survol); }
  .contact { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .contact span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .croix { color: var(--gris); opacity: 0; padding: 3px; border-radius: 4px; }
  .contact:hover .croix, .croix:focus-visible { opacity: 1; }
  .croix:hover { color: var(--encre); background: var(--survol); }
  .bascule { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .switch { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; margin: 0; border-radius: 16px; background: rgba(0,0,0,.2); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch:checked { background: var(--encre); }
  .switch:checked::after { left: 14px; }
  .reglages .retirer { margin-top: 4px; }
  .arr { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; align-items: center; max-width: 720px; padding: 12px 0; border-top: 1px solid var(--filet); }
  .arr .val { display: flex; align-items: center; gap: 8px; color: var(--gris); min-width: 0; overflow-wrap: anywhere; }
  .arr .val i { width: 6px; height: 6px; border-radius: 50%; background: var(--gris); flex: none; }
  .arr .val i.non { background: none; box-shadow: inset 0 0 0 1px var(--gris); }
  .arr .val i.rouge { background: var(--rouge); }
  .arr-form { grid-column: 2 / 4; display: grid; gap: 6px; max-width: 360px; justify-items: start; }
  .arr-form .rang { display: flex; gap: 16px; align-items: center; margin-top: 4px; }

  /* ── la barre ── */
  #barre { flex: none; padding: 0 28px 16px; }
  #dit { min-height: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 0 2px 6px; font-size: 12px; color: var(--gris); }
  #trouve { padding-bottom: 6px; }
  #trouve .envoi { display: flex; align-items: baseline; gap: 12px; padding: 5px 8px; border-radius: 6px; font-size: 12px; color: var(--gris); cursor: pointer; }
  #trouve .envoi .num { margin-left: auto; }
  #trouve .envoi.on { background: var(--choisi); }
  #dit .fort { color: var(--encre); }
  #dit a { font-size: 12px; color: var(--encre); text-decoration: underline; text-underline-offset: 3px; }
  #dit button { font-size: 12px; color: var(--encre); text-decoration: underline; text-underline-offset: 3px; }
  #dit.vient { animation: vient .15s ease-out; }
  @keyframes vient { from { opacity: 0; transform: translateY(3px); } }
  #champ { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border: 1px solid rgba(0,0,0,.13); border-radius: 10px; background: #fff; }
  #champ:focus-within { border-color: var(--indigo); }
  .puce { flex: none; max-width: 42%; padding: 1px 8px; border-radius: 6px; background: var(--choisi); color: var(--indigo-texte); font-size: 12px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #say { flex: 1; min-width: 0; height: 22px; max-height: 160px; padding: 1px 0; border: 0; outline: 0; background: none; resize: none; line-height: 20px; }
  #say::placeholder { color: var(--gris); }

  /* ── la preuve en plein écran : même papier, la preuve flotte ── */
  #plein { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 32px 28px; background: var(--fond); cursor: zoom-out; }
  body.en-plein #plein { display: flex; }
  body.en-plein #col, body.en-plein #volet { visibility: hidden; }
  #plein .haut { display: flex; align-items: baseline; gap: 24px; width: min(100%, calc((100vh - 96px) * 1.6)); }
  #plein .haut span { flex: 1; min-width: 0; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #plein .cadre { width: min(100%, calc((100vh - 96px) * 1.6)); cursor: zoom-out; }

  /* la demande du client à gauche (sans capture) : sous 1000 px, 2 lignes ; si le fil ne commence plus par le client, rien ne s'efface */
  @media (max-width: 999px) { .preuve .lead.replie { -webkit-line-clamp: 2; } #vue.serre .fil-texte > .voix:first-child:not(.du-client) { display: block; } }

  /* ── sous 1000 px : la colonne se resserre, la preuve passe au-dessus du fil, le bouton reste visible ── */
  @media (max-width: 999px) {
    #col { width: 236px; }
    /* la colonne : « À toi » reste collé en haut, la liste s'arrête sur une ligne entière (couper) */
    #liste { padding-top: 0; scroll-padding: 36px 0 12px; }
    .groupe.toi { position: sticky; top: 0; z-index: 1; height: 36px; padding: 10px 10px 6px; line-height: 20px; background: var(--fond); }
    #releve { margin-top: auto; }
    #vue { padding: 16px 20px 0; }
    #barre { padding: 0 20px 12px; }
    #dit:empty { min-height: 0; padding: 0; }
    .tete { margin-bottom: 10px; }
    .corps { display: flex; flex-direction: column; gap: 10px; }
    .preuve { flex: none; gap: 6px; align-self: stretch; }
    .preuve:empty { display: none; }
    /* la preuve prend la hauteur qui reste, toute la largeur, entre 80 et 200 px ; le message, lui, ne cède jamais */
    .preuve:has(.cadre:not(.vide)) { flex: 1 1 0; min-height: 140px; max-height: 228px; }
    #vue.tasse .preuve:has(.cadre:not(.vide)) { min-height: 108px; }
    .preuve .cadre { flex: 1; width: 100%; height: auto; aspect-ratio: auto; min-height: 112px; max-height: 200px; }
    #vue.tasse .preuve .cadre { min-height: 80px; }
    .preuve .cadre img, .preuve .cadre video { object-fit: cover; object-position: top; }
    .preuve.fen:has(.cadre:not(.vide)) { flex: none; min-height: 0; }
    .preuve .cadre.vide { flex: none; min-height: 0; max-height: none; height: 36px; padding: 0 12px; text-align: center; }
    .fil { flex: 0 1 auto; max-height: none; width: 100%; }
    .actions { border-top: 1px solid var(--filet); margin-top: 2px; padding-top: 12px; }
    details { margin-top: 6px; }
    /* le client et Claude tiennent sur une ligne chacun : le nom en gris, puis le texte coupé par « … » ; un clic déplie */
    .voix + .voix { margin-top: 6px; }
    .fil .voix:not(:has(textarea, .envoye, .deplie)) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 20px; }
    .fil .voix:not(:has(textarea, .envoye, .deplie)) :is(.qui, .dit) { display: inline; margin: 0; white-space: nowrap; }
    .fil .voix:not(:has(textarea, .envoye, .deplie)) .qui::after { content: "\a0\a0"; }
    .fil .voix:not(:has(textarea, .envoye, .deplie)) .reserve { margin: 0; white-space: normal; } /* la réserve ne se coupe jamais */
    /* la phrase de Claude se lit entière ; elle ne tient sur une ligne qu'en dernier recours (couperTout) */
    .fil-texte > .voix:nth-child(2):not(:has(textarea, .envoye, .deplie)), .fil-texte > .voix:nth-child(2):not(:has(textarea, .envoye, .deplie)) :is(.qui, .dit) { white-space: normal; }
    #vue.une .fil-texte > .voix:nth-child(2):not(:has(textarea, .envoye, .deplie)), #vue.une .fil-texte > .voix:nth-child(2):not(:has(textarea, .envoye, .deplie)) :is(.qui, .dit) { white-space: nowrap; }
    #vue.serre .fil-texte > .voix:first-child:not(:has(textarea, .envoye, .deplie)) { display: none; } /* ça ne tient pas, même la preuve à 80 px : la ligne du client s'efface */
    /* les réglages passent au-dessus du registre, sur une ligne : la bascule, « Détail » ; les contacts et le reste sont dans le Détail */
    .fiche { display: flex; flex-direction: column; align-items: stretch; gap: 0; overflow-y: auto; }
    .reglages { order: -1; position: relative; margin-bottom: 12px; }
    .reglages .bloc { padding: 0; }
    .reglages .bascule { justify-content: flex-start; padding-right: 60px; }
    .reglages summary { position: absolute; top: 0; right: 0; line-height: 16px; } /* ponytail : « Détail » reste à droite de la bascule, ouvert ou non ; son contenu passe dessous */
    .reglages:not(:has(details[open])) .contacts { display: none; }
    .reglages .contacts { padding-top: 10px; }
    .reglages .detail { margin-top: 10px; }
    .registre { flex: none; max-height: none; margin-bottom: 16px; }
    .reg { padding: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<nav id="col">
  <div id="liste"></div>
  <a id="releve" href="#arrivees"></a>
</nav>
<main id="volet">
  <div id="vue"></div>
  <div id="barre">
    <div id="trouve"></div>
    <div id="dit" aria-live="polite"></div>
    <form id="champ"><span class="puce" id="puce" hidden></span><textarea id="say" rows="1" placeholder="Écris ou colle ici" aria-label="Barre de commande (⌘K)"></textarea></form>
  </div>
</main>
<div id="plein" data-act="fermer-plein"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const JETON = $('meta[name="jeton"]').content;
const MINE = ["question", "erreur", "valider", "message"];

  for (let i = 0; i < 2; i++) {
    if (suivre && on) on.scrollIntoView({ block: "nearest" });
    const hb = l.getBoundingClientRect().top + 36; // une ligne à moitié sous « À toi » collé en haut : on la fait passer dessous
    for (const x of l.querySelectorAll(".ligne")) { const b = x.getBoundingClientRect(); if (b.top < hb - 1 && b.bottom > hb) { l.scrollTop += b.bottom - hb; break; } }
    couper(l, 8);
  }
}
addEventListener("resize", () => { couperTout(false); cadrer(); });
function pose(sel, html) { if (rendus[sel] === html) return false; rendus[sel] = html; $(sel).innerHTML = html; return true; }
function taille(el) { el.style.height = "auto"; el.style.height = `${el.scrollHeight + 2}px`; }
function tailleBarre() { say.style.height = "22px"; say.style.height = `${Math.min(160, Math.max(22, say.scrollHeight))}px`; }
function forcer() { rendus["#vue"] = null; rendre(); }

// ───────── serveur ─────────
async function tick() {
  try { const r = await fetch("/api/state"); if (r.ok) { S = await r.json(); rendre(); for (const t of files().toi) ecart(t).then(cadrer); } }
  catch { dire("Le serveur local ne répond pas."); }
}
let derniereErreur = ""; // la raison du dernier POST raté ; post() continue de rendre null
async function post(chemin, body) {
  try {
    const r = await fetch(chemin, { method: "POST", headers: { "content-type": "application/json", "x-kaoly": JETON }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({ error: "Réponse illisible." }));
    if (j.error) { derniereErreur = j.error; dire(humain(j.error)); return null; }
    if (j.tickets) S = j;
    return j;
  } catch { derniereErreur = "Le serveur local ne répond pas."; dire(derniereErreur); return null; }
}
// la ligne au-dessus de la barre : réponse de Claude, bandeau « Annuler » ou erreur ; elle s'efface seule
function dire(html, ms = 8000, brut = false) {
  const d = $("#dit"); d.innerHTML = brut ? html : esc(html); pasParti = null; // une nouvelle phrase remplace « Pas parti »
  d.classList.remove("vient"); void d.offsetWidth; d.classList.add("vient");
  clearTimeout(effacer); if (ms) effacer = setTimeout(() => { d.innerHTML = ""; }, ms);
}

// Une action ne part au serveur qu'au bout de 5 s ; « Annuler » l'arrête et rouvre la demande. Rien n'est à défaire côté serveur.
// Elle se montre sur la ligne de sa demande dans la colonne (colonne()), pas dans la barre : plusieurs peuvent attendre ensemble.
function retenir(cle, chemin, body, libelle, retour, apres, texte) {
  clearTimeout(retenues.get(cle)?.timer);
  const r = { chemin, body, libelle, retour, texte, timer: setTimeout(() => partir(cle), 5000) };
  retenues.set(cle, r);
  if (apres) aller(apres, true); else rendre();
}
let pasParti = null;
async function partir(cle) {
  const r = retenues.get(cle); if (!r) return;
  const j = await post(r.chemin, r.body);
  retenues.delete(cle);
  if (j) {
    delete drafts[cle];
    const t = r.body.action === "valider" && S?.tickets.find((x) => x.id === cle); // un conflit : Claude repart intégrer la modification plus récente
    if (t && ["file", "travail"].includes(t.status)) dire(`Pas encore en ligne · <span data-contenu>${esc(t.title)}</span> · Claude intègre une modification plus récente`, 8000, true);
  } else {
    if (r.texte) textes[cle] = r.texte; // la retouche revient dans la barre à la réouverture de sa demande
    // pas parti : la ligne reste jusqu'à la prochaine phrase de la barre ou l'ouverture de la demande
    const t = S?.tickets.find((x) => x.id === cle);
    if (t) { dire(`<i class="point"></i><span class="fort">Pas parti · <span data-contenu>${esc(t.title)}</span></span><span>· ${esc(humain(derniereErreur))} ·</span><a class="lien" href="#${adrDemande(cle)}">Ouvrir</a>`, 0, true); pasParti = cle; }
  }
  forcer();
}
function annuler(cle) {
  const r = retenues.get(cle); if (!r) return;
  clearTimeout(r.timer); retenues.delete(cle);
  if (r.retour) aller(r.retour); else forcer();
  if (r.texte) { if (say.value) textes[cle] = r.texte; else { say.value = r.texte; tailleBarre(); say.focus(); say.setSelectionRange(say.value.length, say.value.length); } }
}
function agir(t, action) {
  const nx = suivante(t.id), apres = nx ? adrDemande(nx.id) : "rien", d = brouillon(t), nom = nomDest(t, d.to) ?? "";
  const wa = d.to && !isMail(d.to), pour = wa ? "Ouverture de WhatsApp" : `Envoi à ${nom}`;
  if (action === "principal") {
    if (t.status === "valider") retenir(t.id, "/api/ticket", { id: t.id, action: "valider", send: true, ...d }, pour, adrDemande(t.id), apres);
    else if (t.status === "message") retenir(t.id, "/api/ticket", { id: t.id, action: "envoyer", ...d }, pour, adrDemande(t.id), apres);
    else if (t.status === "erreur") retenir(t.id, "/api/ticket", { id: t.id, action: "relancer" }, "Relance", adrDemande(t.id), apres);
  }
  if (action === "seulement") retenir(t.id, "/api/ticket", { id: t.id, action: "valider" }, "Mise en ligne", adrDemande(t.id), apres);
  if (action === "classer") retenir(t.id, "/api/ticket", { id: t.id, action: "fermer" }, "Classée", adrDemande(t.id), MINE.includes(t.status) ? apres : null);
}

// ───────── la barre ─────────
function decrire(p) {
  const c = S.clients.find((x) => x.id === p.id), ch = [];
  if (!c) ch.push("nouveau client");
  if (p.name && c && p.name !== c.name) ch.push(`nom → ${p.name}`);
  if (typeof p.repo === "string" && p.repo !== (c?.repo ?? "")) ch.push(`dépôt → ${p.repo || "aucun"}`);
  if (Array.isArray(p.contacts)) ch.push(`contacts → ${p.contacts.join(", ")}`);
  if (typeof p.autoProd === "boolean" && p.autoProd !== c?.autoProd) ch.push(`bugs sans validation → ${p.autoProd ? "oui" : "non"}`);
  return `${c?.name ?? p.name ?? ""} : ${ch.join(", ") || "rien ne change"}`;
}
async function envoyerBarre() {
  const text = say.value.trim(); if (!text) return;
  const t = courante(), cible = t && accepte(t) && puceOff !== cle() ? t : null, vise = clientVise();
  say.value = ""; tailleBarre();
  if (cible) {
    const nx = suivante(cible.id); // la retouche attend 5 s comme les autres gestes ; la confirmation, c'est la demande qui passe chez Claude
    return retenir(cible.id, "/api/ticket", { id: cible.id, action: "retouche", text }, "Retouche", adrDemande(cible.id), nx ? adrDemande(nx.id) : "rien", text);
  }
  dire("Claude réfléchit…", 0);
  const j = await post("/api/chat", vise ? { text, clientId: vise.id } : { text });
  if (!j) { say.value = text; tailleBarre(); return; }
  propositions = j.propose ?? [];
  const parts = [`<span class="fort" data-contenu>${esc(j.reply)}</span>`, ...(j.done ?? []).map((d) => `<span data-contenu>✓ ${esc(d)}</span>`),
    ...propositions.map((p) => `<span data-contenu>${esc(decrire(p))}</span>`)];
  if (propositions.length) parts.push(`<button data-act="appliquer">Appliquer</button>`);
  dire(parts.join(""), propositions.length ? 0 : 8000, true); // ponytail : une proposition reste affichée tant qu'elle n'est pas appliquée
  tick();
}
// La barre cherche d'abord elle-même : demandes (réglées comprises), clients, Arrivées. Rien ne part à Claude tant qu'une ligne est choisie.
// ponytail : court texte d'une ligne seulement, sous-chaîne sans accents ni majuscules, 5 lignes au plus
let trouvees = [], pris = -1;
const nu = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function trouver() {
  const q = nu(say.value.trim()), t = courante(), puce = t && accepte(t) && puceOff !== cle();
  trouvees = []; pris = -1;
  if (q && say.value.length < 40 && !say.value.includes("\n")) {
    const ok = (s) => nu(s).includes(q), { toi, claude } = files();
    const reste = S.tickets.filter((x) => !retenues.has(x.id) && !toi.includes(x) && !claude.includes(x)).sort((a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt));
    const ligne = (x, moi) => `<a class="{on}ligne ${moi ? "moi" : "loin"}" href="#${adrDemande(x.id)}" data-h="${adrDemande(x.id)}"><span class="l1"><span class="t" data-contenu>${esc(x.title)}</span></span>
      <span class="l2"><span class="v"><span data-contenu>${esc(x.client)}</span>${x.status === "travail" ? "" : x.status === "fini" ? ` · réglée le ${date(x.sentAt || x.updatedAt)}` : ` · ${verbe(x)}`}</span><span class="num">${age(x.status === "travail" ? x.startedAt || x.updatedAt : x.createdAt)}</span></span></a>`;
    const cl = S.clients.filter((c) => !retenues.has(`c:${c.id}`) && ok(c.name)).map((c) => {
      const a = S.tickets.filter((x) => x.clientId === c.id && x.status !== "fini" && !retenues.has(x.id)).map((x) => x.createdAt).sort()[0];
      return `<a class="{on}client" href="#c=${encodeURIComponent(c.id)}" data-h="c=${encodeURIComponent(c.id)}"><span data-contenu>${esc(c.name)}</span>${a ? `<span class="num gris">${age(a)}</span>` : ""}</a>`; });
    const arr = ok("Arrivées") ? [`<a class="{on}client" href="#arrivees" data-h="arrivees"><span>Arrivées</span></a>`] : [];
    // l'ordre : ce qui est à toi, Claude, les clients, le passé
    trouvees = [...gestes(t, q), ...toi.filter((x) => ok(x.title)).map((x) => ligne(x, true)), ...claude.filter((x) => ok(x.title)).map((x) => ligne(x, false)), ...cl, ...arr,
      ...reste.filter((x) => ok(x.title)).map((x) => ligne(x, false))].slice(0, 5);
    // la dernière ligne envoie la barre ; la première ligne trouvée est choisie d'avance, Entrée l'ouvre
    if (trouvees.length) { trouvees.push(`<a class="{on}envoi" data-envoi><span>${puce ? "Envoyer en retouche" : "Demander à Claude"}</span><span class="num">⌘↵</span></a>`); pris = 0; }
  }
  $("#trouve").innerHTML = trouvees.map((h, i) => h.replace("{on}", i === pris ? "on " : "")).join("");
  $("#dit").hidden = trouvees.length > 0;
}
// Les gestes de la demande ouverte, avec les mots de l'écran : un début de mot du libellé les propose.
// ponytail : « ok » et ses semblables ne valent que pour le bouton plein d'une demande à valider ou à envoyer ; un geste part toujours par agir() et ses 5 s
function gestes(t, q) {
  if (!t || retenues.has(t.id) || q.length < 3 && !/^(ok|oui)$/.test(q)) return [];
  const d = brouillon(t), eteint = t.status !== "erreur" && (!d.to || d.to.startsWith("@")), accord = ["valider", "message"].includes(t.status) && /^(ok|oui|valide|envoie|c'est bon|parfait)$/.test(q.replace(/’/g, "'"));
  const tous = [["principal", ["valider", "message", "erreur"].includes(t.status) && !eteint && libellePrincipal(t), accord], ["seulement", t.status === "valider" && "Sans envoyer"], ["classer", t.status !== "fini" && "Classer"]];
  return tous.filter(([, l, a]) => l && (a || q.length > 2 && nu(l).split(/[\s']+/).some((m) => m.startsWith(q))))
    .map(([g, l]) => `<a class="{on}envoi" data-geste="${g}"><span data-contenu>${esc(l)}</span><span class="num">↵</span></a>`);
}
function choisir(pas) {
  pris = pris < 0 ? (pas > 0 ? 0 : trouvees.length - 1) : (pris + pas + trouvees.length) % trouvees.length;
  [...$("#trouve").children].forEach((el, i) => el.classList.toggle("on", i === pris));
}
function envoyer() { envoyerBarre(); trouver(); } // envoyerBarre vide la barre tout de suite : la liste suit
function geste(el) { const t = courante(); say.value = ""; tailleBarre(); trouver(); if (t) agir(t, el.dataset.geste); }
function ouvrirTrouve(el) { say.value = ""; tailleBarre(); trouver(); aller(el.dataset.h); }
$("#trouve").addEventListener("click", (e) => { const a = e.target.closest("[data-h]"); if (a) { e.preventDefault(); ouvrirTrouve(a); } else if (e.target.closest("[data-geste]")) geste(e.target.closest("[data-geste]")); else if (e.target.closest("[data-envoi]")) envoyer(); });
$("#trouve").addEventListener("mousedown", (e) => e.preventDefault()); // la barre garde le focus
say.addEventListener("input", trouver);
const entree = () => { const el = pris >= 0 && $("#trouve").children[pris]; if (!el) envoyer(); else if (el.dataset.geste) geste(el); else if (el.dataset.envoi !== undefined) envoyer(); else ouvrirTrouve(el); };
$("#champ").addEventListener("submit", (e) => { e.preventDefault(); entree(); });
say.addEventListener("keydown", (e) => {
  // ⌘↵ dans la barre envoie la barre, jamais le bouton de la demande ; barre vide, il remonte et garde son sens
  if (e.metaKey && e.key === "Enter" && say.value.trim()) { e.preventDefault(); e.stopPropagation(); envoyer(); return; }
  if (trouvees.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); choisir(e.key === "ArrowDown" ? 1 : -1); }
  else if (trouvees.length && e.key === "Escape") { e.stopPropagation(); trouvees = []; pris = -1; $("#trouve").innerHTML = ""; $("#dit").hidden = false; }
  else if (e.key === "Enter" && !e.shiftKey && !e.metaKey) { e.preventDefault(); entree(); }
});

// ───────── gestes ─────────
function voisin(pas) {
  const { toi, claude } = files(), l = [...toi, ...claude]; if (!l.length) return;
  const i = l.findIndex((t) => t.id === adresse().d);
  const n = i < 0 ? l[0] : l[Math.max(0, Math.min(l.length - 1, i + pas))];
  aller(adrDemande(n.id), true);
}
function basculer(pas, cle) {
  const t = courante(); if (!t) return;
  const o = preuves(t); if (o.length < 2 && !cle) return;
  const x = choisie(t, o), n = cle ? o.find((y) => y.cle === cle) : o[(o.indexOf(x) + pas + o.length) % o.length];
  choix[t.id] = n.cle;
  const h = adresse();
  aller(adrDemande(t.id, { v: n.cle, plein: "plein" in h || null }), true);
}
function plein(ouvrir) {
  const t = courante(); if (!t || !preuves(t).length) return;
  const h = adresse();
  aller(adrDemande(t.id, { v: h.v, plein: ouvrir || null }), true);
}
document.addEventListener("keydown", (e) => {
  const a = document.activeElement, saisie = a && (/^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox" || a.isContentEditable);
  const enPlein = document.body.classList.contains("en-plein");
  if (e.metaKey && e.key.toLowerCase() === "k") { e.preventDefault(); say.focus(); return; }
  if (e.metaKey && !e.shiftKey && e.key.toLowerCase() === "z" && (!saisie || a === say && !say.value)) { const k = [...retenues.keys()].pop(); if (k) { e.preventDefault(); annuler(k); } return; }
  if (e.metaKey && e.key === "Enter") { const b = $("#vue .plein:not([disabled])"); if (b) { e.preventDefault(); b.click(); } return; }
  if (e.key === "Escape") {
    if (enPlein) plein(false);
    else if (a === say && !$("#puce").hidden) { puceOff = cle(); rendre(); }
    else if (destEdit) { destEdit = null; forcer(); }
    else a?.blur?.();
    return;
  }
  if (saisie && !(a === say && !say.value)) return; // dans la barre vide, ↑ ↓ passent quand même d'une demande à l'autre
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); voisin(e.key === "ArrowDown" ? 1 : -1); }
  else if (saisie) return;
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); basculer(e.key === "ArrowRight" ? 1 : -1); }
  else if (e.key === " ") { e.preventDefault(); plein(!enPlein); }
});

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, t = courante();
  if (el.closest("a")) e.preventDefault();
  if (act === "principal" || act === "seulement" || act === "classer") { if (t && !el.disabled) agir(t, act); return; }
  if (act === "voir") { e.stopPropagation(); return basculer(0, el.dataset.cle); }
  if (act === "plein") return plein(true);
  if (act === "fermer-plein") return plein(false);
  if (act === "deplier") { if (getSelection().toString()) return; deplies.has(t.id) ? deplies.delete(t.id) : deplies.add(t.id); return forcer(); }
  if (act === "dest") { destEdit = t.id; forcer(); const i = $('#vue [data-champ="to"]'); i?.focus(); i?.select(); return; }
  if (act === "ecrire") { const b = $('#vue [data-champ="body"]'); b?.focus(); b?.setSelectionRange(b.value.length, b.value.length); return; }
  if (act === "joindre" && t) { const d = brouillon(t), f = el.dataset.f; drafts[t.id] = { ...d, pieces: d.pieces.includes(f) ? d.pieces.filter((x) => x !== f) : [...d.pieces, f] }; return forcer(); }
  if (act === "annuler") return annuler(el.dataset.cle);
  if (act === "allumer") { await post("/api/config", { auto: true }); return rendre(); }
  if (act === "arrivees") return aller("arrivees");
  if (act === "nouveau") { puceOff = cle(); say.value = "Nouveau client : "; tailleBarre(); rendre(); say.focus(); return; }
  if (act === "appliquer") { const ps = propositions; propositions = []; for (const p of ps) if (!(await post("/api/config", { client: p }))) return; dire("✓ Appliqué"); return rendre(); }
  if (act === "relier") { mailForm = true; return forcer(); }
  if (act === "aide") { mailAide = !mailAide; return forcer(); }
  if (act === "mail") { const j = await post("/api/config", { mail: { user: $("#mailUser").value, password: $("#mailPass").value } }); if (j) { mailForm = false; dire("✓ Boîte reliée"); } return forcer(); }
  const box = el.closest("[data-client]"), c = box && S.clients.find((x) => x.id === box.dataset.client);
  if (act === "ajouter-contact" && c) { ajout = c.id; forcer(); $('#vue [data-cfg="contact"]')?.focus(); return; }
  if (act === "retirer-contact" && c) { await post("/api/config", { client: { id: c.id, contacts: c.contacts.filter((k) => k !== el.dataset.k) } }); return forcer(); }
  if (act === "retirer-client" && c) {
    const nx = files().toi[0];
    return retenir(`c:${c.id}`, "/api/config", { removeClient: c.id }, `${c.name} retiré`, `c=${encodeURIComponent(c.id)}`, nx ? adrDemande(nx.id) : "rien");
  }
});
document.addEventListener("input", (e) => {
  const el = e.target, k = el.dataset.champ;
  if (el === say) return tailleBarre();
  if (!k) return;
  const t = courante(); if (!t) return;
  drafts[t.id] = { ...brouillon(t), [k]: el.value };
  if (el.tagName === "TEXTAREA") taille(el);
  const b = $("#vue .plein"), to = drafts[t.id].to;
  if (b && t.status !== "erreur") b.disabled = !to || to.startsWith("@");
});
document.addEventListener("focusout", (e) => { if (e.target.dataset?.champ === "to") setTimeout(() => { if (destEdit && !$("#vue").contains(document.activeElement)) { destEdit = null; forcer(); } }, 0); });
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (el.dataset?.champ === "to" && e.key === "Enter") { e.preventDefault(); destEdit = null; el.blur(); forcer(); }
  if (el.dataset?.cfg === "contact" && e.key === "Enter" && el.value.trim()) {
    e.preventDefault();
    const c = S.clients.find((x) => x.id === el.closest("[data-client]").dataset.client), v = el.value.trim();
    el.value = ""; el.blur();
    post("/api/config", { client: { id: c.id, contacts: [...c.contacts, v] } }).then(forcer);
  }
  if (el.dataset?.cfg === "contact" && e.key === "Escape") { ajout = null; forcer(); }
  if (el.dataset?.cfg === "repo" && e.key === "Enter") el.blur();
});
// ponytail : le champ d'un nouveau contact se referme dès qu'il perd le focus sans texte ; l'état ouvert du Détail est gardé d'un rendu à l'autre
document.addEventListener("focusout", (e) => { if (e.target.dataset?.cfg === "contact") setTimeout(() => { if (ajout && !e.target.value.trim()) { ajout = null; forcer(); } }, 0); });
document.addEventListener("toggle", (e) => { if (e.target.parentElement?.classList.contains("reglages")) detailOuvert = e.target.open; }, true);
document.addEventListener("change", (e) => {
  const el = e.target, k = el.dataset.cfg; if (!k) return;
  if (k === "auto") return post("/api/config", { auto: el.checked }).then(forcer);
  const id = el.closest("[data-client]")?.dataset.client; if (!id) return;
  if (k === "repo") post("/api/config", { client: { id, repo: el.value } }).then(forcer);
  if (k === "autoProd") post("/api/config", { client: { id, autoProd: el.checked } }).then(forcer);
});
addEventListener("hashchange", () => { destEdit = null; rendre(); });
setInterval(tick, 2000); tick();
</script>
